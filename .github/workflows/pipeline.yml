name: Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # Code style is frontend-agnostic, so it runs once in a plain Python env (no Binary Ninja needed).
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install formatters
        run: pip install ".[dev]"
      - name: Run Format Check
        run: make check-format CONFIG_NO_VENV=1

  # Binary Ninja frontend: runs natively on the runner. Binary Ninja is downloaded headless via
  # Vector35's official setup action (serial extracted from the BINJA_LICENSE secret), so no Docker
  # image or GitLab mirror is needed. Requires the private license, so it does not run on forks.
  binja-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Extract Binary Ninja serial from license
        id: binja
        run: |
          serial=$(echo "${{ secrets.BINJA_LICENSE }}" | base64 --decode | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['serial'])")
          echo "::add-mask::$serial"
          echo "serial=$serial" >> "$GITHUB_OUTPUT"
      - name: Install Binary Ninja (headless)
        uses: Vector35/setup-binary-ninja@v1-beta
        with:
          license: ${{ steps.binja.outputs.serial }}
          python-support: 'true'
      - name: Set up Binary Ninja license
        run: |
          mkdir -p ~/.binaryninja
          echo "${{ secrets.BINJA_LICENSE }}" | base64 --decode > ~/.binaryninja/license.dat
      - name: Install build tools + dewolf
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-multilib graphviz
          pip install ".[dev]"
      - name: Run Tests
        id: run_tests
        run: make CONFIG_NO_VENV=1
      - name: Upload Crash Reports
        if: ${{ failure() && steps.run_tests.conclusion == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports-binja
          path: crash_reports/*
          retention-days: 7

  # Ghidra frontend + GUI plugin: Ghidra is a free download, so this job needs no secrets and also
  # runs on forks. Mirrors the binja job (build tool -> run tests -> upload crash reports).
  ghidra-tests:
    runs-on: ubuntu-latest
    env:
      GHIDRA_VERSION: "12.1.2"
      GHIDRA_INSTALL_DIR: ${{ github.workspace }}/ghidra/ghidra_12.1.2_PUBLIC
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install build tools for samples
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib graphviz
      - name: Cache Ghidra
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ghidra
          key: ghidra-${{ env.GHIDRA_VERSION }}
      - name: Download Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          ASSET_URL=$(curl -sL "https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/tags/Ghidra_${GHIDRA_VERSION}_build" | jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' | head -n1)
          echo "Downloading $ASSET_URL"
          curl -L "$ASSET_URL" -o ghidra.zip
          unzip -q ghidra.zip -d "${{ github.workspace }}/ghidra"
      - name: Install Python dependencies
        run: pip install ".[dev,ghidra]"
      - name: Run Ghidra Tests
        id: run_tests
        run: make ghidra-tests CONFIG_NO_VENV=1
      - name: Upload Crash Reports
        if: ${{ failure() && steps.run_tests.conclusion == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports-ghidra
          path: crash_reports/*
          retention-days: 7
