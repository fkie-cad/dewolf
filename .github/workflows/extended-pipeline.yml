name: Extended Pipeline

on:
  schedule:
    - cron:  '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docker-and-run-extended-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup BinaryNinja License
        run: |
          echo "${{ secrets.BINJA_LICENSE }}" | base64 --decode > license.txt
      - name: Check Secrets
        env:
          BINJA_LICENSE: ${{ secrets.BINJA_LICENSE }}
          GITLAB_BINJA_TOKEN: ${{ secrets.GITLAB_BINJA_TOKEN }}
        run: |
          [ -n "$BINJA_LICENSE" ] && [ -n "$GITLAB_BINJA_TOKEN" ] || { echo "::error::Secrets BINJA_LICENSE/GITLAB_BINJA_TOKEN not available (pull request from a fork?)"; exit 1; }
      - name: Download BinaryNinja.zip
        run: |
          curl -fsSL --retry 3 --header "PRIVATE-TOKEN: ${{ secrets.GITLAB_BINJA_TOKEN }}" "https://gitlab.fkie.fraunhofer.de/api/v4/projects/1250/repository/archive.zip?sha=binja" -o complete_repo.zip
      - name: Build Docker Image
        run: |
          docker build -t dewolf .
      - name: Run Tests
        id: run_tests
        run: |
          docker run -v "$(pwd)"/artifacts:/opt/dewolf/crash_reports dewolf make extendedtests
      - name: Upload Crash Reports
        if: ${{ failure() && steps.run_tests.conclusion == 'failure' }}  # Only run if previous steps fail
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports
          path: artifacts/*
          retention-days: 7 # Adjust retention as needed
